<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zion</title>
<link rel="stylesheet" href="./css/hud.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <header id="titlebar">
    <h1 id="city-name">Zion</h1>
    <p id="city-subtitle">loading&hellip;</p>
  </header>

  <section id="legend" aria-label="Legend">
    <h2>Legend</h2>
    <ul id="legend-list"></ul>
    <div id="legend-notes"></div>
  </section>

  <section id="inspector" hidden aria-label="Inspector">
    <button id="inspector-close" title="Close">&times;</button>
    <h2 id="inspector-title">&mdash;</h2>
    <p id="inspector-path"></p>
    <dl id="inspector-metrics"></dl>
    <div id="inspector-floors"></div>
    <p id="inspector-source-hint" class="hint"></p>
  </section>

  <section id="xray" aria-label="Legend key">
    <h2>Keys</h2>
    <table id="xray-table"></table>
  </section>

  <footer id="controls">
    <div class="control">
      <label for="time">Time</label>
      <input id="time" type="range" min="0" max="24" step="0.1" value="12">
      <output id="time-out">12:00</output>
    </div>
    <div class="control">
      <label for="lit">Lit windows</label>
      <input id="lit" type="range" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly</span>
      <span><kbd>Q</kbd><kbd>E</kbd> down/up</span>
      <span><kbd>Shift</kbd> boost</span>
      <span><kbd>O</kbd> overview</span>
      <span><kbd>L</kbd> legend</span>
      <span>click to inspect</span>
      <span><kbd>Esc</kbd> release mouse</span>
    </div>
  </footer>
</div>

<div id="loading"><div class="spinner"></div><span id="loading-text">Building the city&hellip;</span></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
